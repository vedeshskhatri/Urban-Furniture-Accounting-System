services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urban
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urban
      JWT_SECRET: ${JWT_SECRET:-973feb758c1b75f8eb452e732f71e51a27bcc0725dfff4a9951f54091787bab8}
      NODE_ENV: development
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:5173
      PORT: "5000"
      RAZORPAY_KEY_ID: "rzp_test_TYL9FJAZxMYoFc"
      RAZORPAY_KEY_SECRET: "98JCu3v5NpfezNpgqCOCjFbH"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    ports:
      - "5002:5000"
    volumes:
      - ./api:/app
      - ./shared:/shared
      - ./shared:/app/shared
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm run dev -- --host"
    environment:
      API_TARGET: http://api:5000
      VITE_API_URL: ""
      VITE_RAZORPAY_KEY_ID: "rzp_test_TYL9FJAZxMYoFc"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - ./shared:/shared
      - ./shared:/app/shared
      - client_node_modules:/app/node_modules
    depends_on:
      - api

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

volumes:
  db_data:
  api_node_modules:
  client_node_modules:
  ollama_models:

